name: Build LumaGram (Windows x64)

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    steps:
      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: ${{ env.TBUILD }}/${{ env.REPO_NAME }}

      - name: Submodules
        shell: bash
        run: |
          cd $TBUILD/$REPO_NAME
          git submodule update --init --depth=1

      - name: First set up
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

          echo "Freeing disk space on runner drives..."
          rm -rf /c/hostedtoolcache/windows/Java* || true
          rm -rf /c/hostedtoolcache/windows/Ruby* || true
          rm -rf /c/hostedtoolcache/windows/go* || true
          rm -rf /c/hostedtoolcache/windows/stack* || true
          rm -rf /c/npm || true
          rm -rf "$LOCALAPPDATA/Android" || true
          rm -rf "$LOCALAPPDATA/pip" || true
          rm -rf /c/SeleniumWebDrivers || true
          rm -rf /c/tools/php || true
          rm -rf /c/vcpkg || true

      - name: Native Tools Command Prompt
        uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache
        id: cache-third-party
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Restore Libraries cache
        id: cache-libs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2rel-${{ env.CACHE_KEY }}-4
          restore-keys: |
            ${{ runner.OS }}-x64-libs-v2rel-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-x64-libs-v2rel-

      - name: Restore Qt cache
        id: cache-qt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qtrel-${{ env.CACHE_KEY }}-4
          restore-keys: |
            ${{ runner.OS }}-x64-qtrel-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-x64-qtrel-

      - name: Build Libraries
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Free up some disk space
        shell: bash
        run: |
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete || true
          rm -rf $LibrariesPath/*/.git || true
          rm -rf $LibrariesPath/*/builddir* || true
          rm -rf $LibrariesPath/*/out.x86_64 || true
          rm -rf $LibrariesPath/*/out.arm64 || true
          rm -rf $LibrariesPath/*/target/x86_64* || true
          rm -rf $LibrariesPath/tg_owt/out || true
          rm -rf $LibrariesPath/tde2e/out || true

      - name: Save ThirdParty cache
        if: always() && steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.cache-third-party.outputs.cache-primary-key }}

      - name: Save Libraries cache
        if: always() && steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Save Qt cache
        if: always() && steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-qt.outputs.cache-primary-key }}

      - name: Generate stub DesktopPrivate
        shell: bash
        run: |
          mkdir -p $TBUILD/DesktopPrivate
          random_key() {
            printf -- '-----BEGIN RSA PRIVATE KEY-----\\n%s\\n-----END RSA PRIVATE KEY-----\\n' \
              "$(head -c 96 /dev/urandom | base64 | tr -d '\n')"
          }
          printf 'const char *PrivateKey = "%s";\nconst char *PrivateBetaKey = "%s";\n' \
            "$(random_key)" "$(random_key)" > $TBUILD/DesktopPrivate/packer_private.h
          printf 'static const char *AlphaPrivateKey = "%s";\n' \
            "$(random_key)" > $TBUILD/DesktopPrivate/alpha_private.h

      - name: Configure and Build LumaGram
        shell: pwsh
        run: |
          Set-Location "$env:TBUILD\$env:REPO_NAME\Telegram"
          cmd /c "configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 -D CMAKE_CONFIGURATION_TYPES=Release -D DESKTOP_APP_SPECIAL_TARGET=win64 -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmake --build ..\out --config Release --target Telegram --parallel 2>&1 | Tee-Object -FilePath "$env:TBUILD\build.log"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== COMPILER ERRORS SUMMARY ==="
            Select-String -Path "$env:TBUILD\build.log" -Pattern "error C|error LNK|error RC|CUSTOMBUILD : error|RCC: Error|Error :" -Context 2,2 | ForEach-Object { Write-Host $_.ToString() }
            exit 1
          }

      - name: Package Release
        shell: bash
        run: |
          cd $TBUILD/$REPO_NAME/out/Release
          mkdir -p package
          if [ -f LumaGram.exe ]; then
            cp LumaGram.exe package/
          elif [ -f Telegram.exe ]; then
            cp Telegram.exe package/LumaGram.exe
          fi
          if [ -d modules ]; then
            cp -r modules package/
          fi
          cd package
          7z a -tzip -mx9 ../LumaGram-Windows-x64.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LumaGram-Windows-x64
          path: ${{ env.TBUILD }}/${{ env.REPO_NAME }}/out/Release/LumaGram-Windows-x64.zip
          retention-days: 14
