name: Build LumaGram (Windows x64)

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    steps:
      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.TBUILD }}/${{ env.REPO_NAME }}

      - name: Submodules
        shell: bash
        run: |
          cd $TBUILD/$REPO_NAME
          git submodule update --init --depth=1

      - name: Setup Visual Studio MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Cache ThirdParty
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-v1
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Cache Libraries
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v1
          restore-keys: ${{ runner.OS }}-x64-libs-

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.LibrariesPath }}\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-v1
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Build Libraries
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Configure CMake
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat x64 -D CMAKE_CONFIGURATION_TYPES=Release -D DESKTOP_APP_SPECIAL_TARGET=win64 -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build LumaGram
        run: |
          cmake --build %TBUILD%\%REPO_NAME%\out --config Release --parallel

      - name: Package Release
        shell: bash
        run: |
          cd $TBUILD/$REPO_NAME/out/Release
          mkdir -p package
          if [ -f LumaGram.exe ]; then
            cp LumaGram.exe package/
          elif [ -f Telegram.exe ]; then
            cp Telegram.exe package/LumaGram.exe
          fi
          if [ -f Updater.exe ]; then
            cp Updater.exe package/
          fi
          cd package
          7z a -tzip ../LumaGram-Windows-x64.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaGram-Windows-x64
          path: ${{ env.TBUILD }}/${{ env.REPO_NAME }}/out/Release/LumaGram-Windows-x64.zip
          retention-days: 14
